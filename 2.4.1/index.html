    <head>

        <title>Inline e inline-block</title>
        <link rel="stylesheet" href="styles.css" />

    <body>
        <div class="demo1">Esta es la caja 1 de contenido</div>
        <div class="demo1">Esta es la caja 2 de contenido</div>
        <div class="demo1">Esta es la caja 3 de contenido</div>
        <hr>
        <div class="demo2">Esta es la caja 1 de contenido</div>
