<!DOCTYPE html>
<HTML lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Display y visibility</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div>Esta es la caja de contenido que se muestra</div>
        <hr>
        <div class="demo1">Esta es la caja de contenido hidden</div>
        <hr>
        <div class="demo2">Esta es la caja de contenido con display none</div>
        <hr>

        <!-- Con visibility: hidden la caja no se ve, pero deja su hueco de 150px.
        Con display: none la caja no se ve ni ocupa espacio,
        por eso las dos últimas líneas quedan juntas. -->
    </body>
</HTML>
